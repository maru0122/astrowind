<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>路線 ＆ 駅マップテスト</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #111; font-family: sans-serif; }
        #map { width: 100vw; height: 100vh; }

        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
        }
        .leaflet-popup-content b { color: #00ffcc; }

        /* 駅名ラベル */
        .station-label {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            color: #ffffff !important;
            font-size: 11px !important;
            font-weight: bold !important;
            text-shadow: 
                1px 1px 2px #000, 
               -1px -1px 2px #000, 
                1px -1px 2px #000, 
               -1px 1px 2px #000,
                0px 0px 4px #000;
            pointer-events: none;
        }
        .station-label::before { display: none !important; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="./N02-20_RailroadSection.js"></script>
    <script src="./N02-20_Station.js"></script>

    <script>
        const map = L.map('map', { 
            preferCanvas: true 
        }).setView([35.6812, 139.7671], 13);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri',
            maxZoom: 16
        }).addTo(map);

        // 1. 路線データの描画
        if (typeof railwayData !== 'undefined') {
            L.geoJSON(railwayData, {
                style: function(feature) {
                    const props = feature.properties || {};
                    const isJR = (props.N02_004 || '').includes('旅客鉄道');
                    return {
                        color: isJR ? '#00ffcc' : '#ff7700',
                        weight: 2.5,
                        opacity: 0.8
                    };
                },
                onEachFeature: function(feature, layer) {
                    const props = feature.properties || {};
                    layer.bindPopup(`<b>${props.N02_004 || ''}</b><br>${props.N02_003 || ''}`);
                }
            }).addTo(map);
        }

        // 2. 駅データの座標・名前をメモリに配列化（ここではDOMを作らないため極めて高速）
        const stationList = [];
        if (typeof stationData !== 'undefined') {
            stationData.features.forEach(feature => {
                const geom = feature.geometry || {};
                const props = feature.properties || {};
                let lat, lng;

                if (geom.type === 'MultiLineString' && geom.coordinates.length > 0) {
                    const firstLine = geom.coordinates[0];
                    const midIndex = Math.floor(firstLine.length / 2);
                    lng = firstLine[midIndex][0];
                    lat = firstLine[midIndex][1];
                } else if (geom.type === 'LineString' && geom.coordinates.length > 0) {
                    const midIndex = Math.floor(geom.coordinates.length / 2);
                    lng = geom.coordinates[midIndex][0];
                    lat = geom.coordinates[midIndex][1];
                } else if (geom.type === 'Point') {
                    lng = geom.coordinates[0];
                    lat = geom.coordinates[1];
                }

                if (lat !== undefined && lng !== undefined) {
                    stationList.push({
                        lat: lat,
                        lng: lng,
                        name: props.N02_005 || '駅名未設定',
                        line: props.N02_003 || '',
                        company: props.N02_004 || ''
                    });
                }
            });
        }

        // 3. 画面内の駅だけを描画するレイヤー
        const visibleStationLayer = L.layerGroup().addTo(map);

        function updateVisibleStations() {
            visibleStationLayer.clearLayers();

            // ズーム13未満（引きの表示）では文字を作らずスキップ
            if (map.getZoom() < 13) return;

            const bounds = map.getBounds();

            // 画面内（bounds内）にある駅（せいぜい数十件）だけピンとラベルを生成
            for (let i = 0; i < stationList.length; i++) {
                const st = stationList[i];
                if (bounds.contains([st.lat, st.lng])) {
                    const marker = L.circleMarker([st.lat, st.lng], {
                        radius: 5,
                        fillColor: '#ffffff',
                        color: '#00ffff',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.9
                    });

                    marker.bindTooltip(st.name, {
                        permanent: true,
                        direction: 'right',
                        offset: [6, 0],
                        className: 'station-label'
                    });

                    marker.bindPopup(`<b>${st.name}駅</b><br>${st.company} / ${st.line}`);
                    visibleStationLayer.addLayer(marker);
                }
            }
        }

        // 移動・ズームが終わった時だけ画面内判定を実行
        map.on('moveend', updateVisibleStations);
        updateVisibleStations();
    </script>
</body>
</html>
