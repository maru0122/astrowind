site:
  name: e-Shikumi-labo
  site: 'https://e-shikumi-labo.com'
  base: '/'
  trailingSlash: true # ★ false から true に変更しました

  googleSiteVerificationId: orcPxI47GSa-cRvY11tUe6iGg2IO_RPvnA1q95iEM3M

# Default SEO metadata
metadata:
  title:
    default: e-Shikumi-Labo # ★ AstroWind から変更
    template: '%s — e-Shikumi-Labo'
  description: "GoogleスプレッドシートやGASを活用し、毎日の「手作業コピペ」やWebデータ取得をきれいに仕組み化。単なるツールの納品ではなく、AIを味方につけて「自分で作り、自分で直せる自走力」を養う伴走支援を行う個人ラボです。" # ★ 変更
  robots:
    index: true
    follow: true
  openGraph:
    site_name: e-Shikumi-Labo # ★ AstroWind から変更
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 630
    type: website
  twitter:
    handle: '' # ★ 不要なら空欄、あればご自身のX（Twitter）ID
    site: ''   # ★ 同上
    cardType: summary_large_image

i18n:
  language: ja
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: 'G-VZJB0E6Z8W'

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
